name: E2E Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  e2e:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm ci

      - name: Cache npm (Linux/Mac)
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache npm (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ env.USERPROFILE }}\\AppData\\Roaming\\npm-cache
          key: windows-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            windows-node-

      - name: Run e2e tests (Linux/macOS)
        if: runner.os != 'Windows'
        env:
          PORT: 8080
        run: |
          npm run e2e
          # generate a11y report (creates cypress/results/a11y.html and sets exit code when violations exist)
          node scripts/generate_a11y_report.js || true
          # fail the job if violations were reported (script sets exit code 2 when violations exist)
          if [ $? -eq 2 ]; then echo "Accessibility violations detected (see artifact)"; exit 2; fi

      - name: Run e2e tests (Windows - PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PORT: 8080
        run: |
          # On Windows use PowerShell for clearer process handling
          npm run e2e
          # generate a11y report
          node scripts/generate_a11y_report.js ; if ($LASTEXITCODE -eq 2) { Write-Error 'Accessibility violations detected (see artifact)'; exit 2 }

      - name: Upload Cypress artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos-screenshots
          path: |
            cypress/videos
            cypress/screenshots

      - name: Upload accessibility results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-a11y-results
          path: |
            cypress/results/a11y.json
            cypress/results/a11y.html
