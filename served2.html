<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AHKstrategies - Test</title>
  <style>body{font-family:Arial;background:#111;color:#eee} .sidebar{width:240px;padding:20px;position:fixed;left:0;top:0;bottom:0;background:#111;border-right:1px solid #222} .main{margin-left:260px;padding:20px} .nav-item{display:block;padding:8px;color:#ccc;cursor:pointer} .nav-item.active{color:#6fb0ff}
  .page-content{display:none}
  .page-content.active-page{display:block}
  #modal{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center}
  #modal .dialog{background:#222;padding:16px;border-radius:6px;color:#fff}
  </style>
</head>
<body>
  <button id="menu-toggle" aria-expanded="false" style="position:fixed;left:10px;top:10px">Menu</button>
  <nav id="sidebar" class="sidebar" role="navigation" aria-label="Primary navigation">
    <div class="logo">AHKstrategies</div>
    <div class="nav-item" data-page="home">Home</div>
    <div class="nav-item" data-page="about">About</div>
    <div class="nav-item" data-page="contact">Contact</div>
  </nav>

  <main id="main-content" class="main" role="main">
    <section id="page-home" class="page-content"><h1>Home</h1><p>Welcome</p></section>
    <section id="page-about" class="page-content"><h2>About</h2><p>About text</p></section>
    <section id="page-contact" class="page-content">
      <h2>Contact</h2>
      <form id="contact-form">
        <label>Name <input name="name" required /></label><br>
        <label>Email <input name="email" type="email" required /></label><br>
        <label>Message <textarea name="message" required></textarea></label><br>
        <button type="submit">Send</button>
        <button type="button" id="form-reset">Reset</button>
      </form>
    </section>
  </main>

  <div id="modal" role="dialog" aria-modal="true"><div class="dialog"><h3 id="modal-title">Title</h3><p id="modal-desc">Desc</p><button id="modal-close">Close</button></div></div>

  <script>
    const pages = document.querySelectorAll('.page-content');
    const navItems = document.querySelectorAll('.nav-item');
    const sidebar = document.getElementById('sidebar');
    const menuToggle = document.getElementById('menu-toggle');
    const modal = document.getElementById('modal');
    const modalClose = document.getElementById('modal-close');

    function hashToPage(hash){
      if(!hash) return 'home';
      if(hash.startsWith('#/')) return hash.slice(2);
      if(hash.startsWith('#')) return hash.slice(1);
      return hash;
    }

    function setActiveNav(pageId){
      navItems.forEach(item => {
        if(item.dataset.page === pageId){ item.classList.add('active'); item.setAttribute('aria-current','page'); }
        else { item.classList.remove('active'); item.removeAttribute('aria-current'); }
      });
    }

    function changePage(pageId, replaceHash=false){
      const target = document.getElementById('page-' + pageId);
      if(!target) return;
      pages.forEach(p=>{ p.classList.remove('active-page'); });
      target.classList.add('active-page');
      setActiveNav(pageId);
      const friendly = '#/' + pageId;
      try{ if(replaceHash) history.replaceState(null,'',friendly); else history.pushState(null,'',friendly);}catch(e){ window.location.hash = friendly }
      const heading = target.querySelector('h1,h2'); if(heading){ heading.setAttribute('tabindex','-1'); heading.focus(); }
    }

    if(navItems && navItems.length){ navItems.forEach(item=>{
      item.setAttribute('role','button'); item.setAttribute('tabindex','0');
      item.addEventListener('click', ()=>{ changePage(item.dataset.page); if(sidebar) sidebar.classList.remove('open'); });
      item.addEventListener('keydown', (e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); item.click(); } });
    }); }

    if(menuToggle){ menuToggle.addEventListener('click', ()=>{ if(sidebar) sidebar.classList.toggle('open'); const expanded = sidebar ? sidebar.classList.contains('open') : false; menuToggle.setAttribute('aria-expanded', expanded); }); }

    window.addEventListener('popstate', ()=>{ const id = hashToPage(window.location.hash); changePage(id,true); });

    const form = document.getElementById('contact-form'); const formReset = document.getElementById('form-reset');
    if(form){ form.addEventListener('submit', async (e)=>{ e.preventDefault(); const data = Object.fromEntries(new FormData(form)); try{ const resp = await fetch('/submit', { method:'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(data) }); if(!resp.ok) throw new Error('Network'); if(modal){ modal.style.display='flex'; document.getElementById('modal-title').textContent='Message Sent'; document.getElementById('modal-desc').textContent='Thanks'; modal.focus(); } form.reset(); }catch(err){ if(modal){ modal.style.display='flex'; document.getElementById('modal-title').textContent='Saved locally'; document.getElementById('modal-desc').textContent='Saved locally'; } const localMessages = JSON.parse(localStorage.getItem('ahk_messages')||'[]'); localMessages.push({ts:Date.now(),data}); localStorage.setItem('ahk_messages', JSON.stringify(localMessages)); } }); }
    if(formReset && form){ formReset.addEventListener('click', ()=>form.reset()); }
    if(modalClose && modal){ modalClose.addEventListener('click', ()=> modal.style.display='none'); }
    window.addEventListener('keydown', (e)=>{ if(e.key==='Escape' && modal && modal.style.display==='flex'){ modal.style.display='none'; } });

    document.addEventListener('DOMContentLoaded', ()=>{ const pageId = hashToPage(window.location.hash)||'home'; pages.forEach(p=>p.classList.remove('active-page')); changePage(pageId,true); const main = document.getElementById('main-content'); if(main) main.setAttribute('tabindex','-1'); document.querySelectorAll('a,button,input,textarea,[role="button"]').forEach(el=>{ if(!el) return; if(!el.hasAttribute('tabindex')) el.setAttribute('tabindex','0'); }); });
  </script>
</body>
</html>
